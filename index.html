<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch; the styles keep the content in the safe area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <script>
      // In the iOS app on an iPad: the game, made for phones (a column of at most 480px), zoomed
      // in to fill the screen. As much zoom as leaves a page of at least 440 x 780: as wide as a
      // big phone, and tall enough that no screen scrolls (the level screen needs 678, a stage
      // 731, plus room for the status bar and for Safari's fonts; on a 10" iPad: a 585 x 780
      // page, drawn 1.4x). Done here, through the viewport, before anything is drawn: iOS then lays the page
      // out at that width and scales it to the screen. (The web view's own zoom, pageZoom, only
      // drew it larger at the full width: too big, and scrolling.) The app is portrait only and
      // full screen (Info.plist), so the size never changes. Phones, and browsers, stay at 1x.
      // The same rule on Android tablets: MainActivity.java.
      (function () {
        var cap = window.Capacitor;
        if (!cap || !cap.getPlatform || cap.getPlatform() !== "ios") return;
        var w = Math.min(screen.width, screen.height);
        var h = Math.max(screen.width, screen.height);
        var zoom = Math.min(w / 440, h / 780);
        if (zoom <= 1.01) return;
        document.querySelector('meta[name="viewport"]').setAttribute("content",
          "width=" + Math.round(w / zoom) + ", initial-scale=" + zoom + ", minimum-scale=" + zoom +
          ", maximum-scale=" + zoom + ", user-scalable=no, viewport-fit=cover");
      })();
    </script>
    <meta name="theme-color" content="#ffffff" />
    <title>Flip Tiles</title>
    <!-- As an app on the home screen (Safari: Share > Add to Home Screen): its name, icon, and
         full screen, without the browser's bars -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flip Tiles" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <!-- Shared by the small earned stars (icons.css): their fill, a round gradient lit from the
         top left, so they look domed and shiny: gold, and blue for the bonus levels' -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="gold-star" cx="0.38" cy="0.32" r="0.75">
          <stop offset="0" stop-color="#fff6c9" />
          <stop offset="0.3" stop-color="#ffd24a" />
          <stop offset="0.7" stop-color="#f0a417" />
          <stop offset="1" stop-color="#c47a06" />
        </radialGradient>
        <radialGradient id="bonus-star" cx="0.38" cy="0.32" r="0.75">
          <stop offset="0" stop-color="#e8f9ff" />
          <stop offset="0.3" stop-color="#7fd0ff" />
          <stop offset="0.7" stop-color="#3a8ff0" />
          <stop offset="1" stop-color="#2450c4" />
        </radialGradient>
      </defs>
    </svg>
    <main id="app"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
