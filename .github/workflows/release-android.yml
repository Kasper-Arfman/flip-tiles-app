# Publishing a GitHub release (tag v1.2.3) builds the Android app, signs it with the upload key,
# attaches the .aab to the release, and uploads it to Google Play's internal testing track. From
# there it is promoted to production by hand in the Play Console (a last look before players get
# it). Setup and the secrets it needs: docs/developer/deploy/android.md.
# A release marked "Set as a pre-release" skips the release check, so a test build (TEST_BUILD on,
# Google's test ads) can go to internal testing.
name: Release Android

on:
  release:
    types: [published]
  workflow_dispatch: # (or start it by hand, from the Actions tab)

permissions:
  contents: write # (to attach the .aab to the release)

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      # Not a test build, real ad ids, the privacy contact filled in, ... (scripts/release-check.mjs)
      # Skipped for a pre-release: those are test builds for internal testing.
      - if: ${{ !github.event.release.prerelease }}
        run: npm run release-check -- --android
      - run: npx tsc --noEmit && npx vitest run

      # The version from the release's tag (v1.2.3 -> 1.2.3), into package.json and the native project
      - name: Version from the tag
        if: github.event_name == 'release'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run sync

      - name: Signed app bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease

      - name: Attach to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/bundle/release/app-release.aab --clobber

      # The upload to Google Play doesn't fail the run: the .aab is already on the GitHub release,
      # and can be uploaded by hand. scripts/play-upload.mjs prints Google's reason when it is
      # refused, and tries again as a draft for an app that was never published. The run's summary
      # says what happened.
      - name: Upload to Google Play (internal testing)
        id: play
        continue-on-error: true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: node scripts/play-upload.mjs android/app/build/outputs/bundle/release/app-release.aab

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.play.outputs.result }}
          REASON: ${{ steps.play.outputs.reason }}
        run: |
          {
            echo "## Android ${GITHUB_REF_NAME}"
            if [ "$RESULT" = "completed" ]; then
              echo "Uploaded to Google Play, **internal testing**, and rolled out to the testers."
            elif [ "$RESULT" = "draft" ]; then
              echo "Uploaded to Google Play as a **draft**: Play Console → Test and release → Internal testing → edit the release → *Next* → *Save and publish*."
            else
              echo "**Not uploaded to Google Play.** Google said: ${REASON:-(the build failed before the upload)}"
              echo ""
              echo "The \`.aab\` is on the GitHub release (and in this run's artifacts): it can be uploaded by hand, Play Console → Test and release → Internal testing → *Create new release*. See docs/developer/deploy/android.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # (also when started by hand, when there is no release to attach it to)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
