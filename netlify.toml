# Netlify: how the site is built and served (the web version, and the online leaderboards of
# ranked mode as a function). Used by `npx netlify deploy` and by deploys from git.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# `npm run serve` (netlify dev): the whole site on this computer, at http://localhost:8888: the
# game (Vite's dev server, with live reload) and the leaderboards' function, with a local data
# store of its own. Nothing is uploaded and no Netlify credits are used.
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"
