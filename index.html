<!doctype html>
<html lang="en">
  <head>

    <!-- viewport-fit=cover: draw under the notch; the styles keep the content in the safe area -->

    <meta name="theme-color" content="#ffffff" />
    <title>Flip Tiles</title>
    <!-- As an app on the home screen (Safari: Share > Add to Home Screen): its name, icon, and
         full screen, without the browser's bars -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flip Tiles" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

    <main id="app"></main>
    <script type="module" src="./src/main.ts"></script>
